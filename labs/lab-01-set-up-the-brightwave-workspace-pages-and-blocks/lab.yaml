lab: 1
title: Set Up the Brightwave Workspace, Pages and Blocks
course:
  title: Mastering Notion for Content, Project, and Database Management
  code: TGS-2023041080
  version: v6
topic: 1
day: 1
level: Foundation
alignment:
  knowledge: K1
  ability: A1
tools: Notion (web or desktop app)
objective: Create a Notion workspace and build its first page hierarchy from blocks, following the agreed structure
goal: You create the Brightwave Media workspace, build the top-level page structure from the supplied site map,
  and learn how blocks, slash commands, sub-pages, breadcrumbs and the sidebar work by building the Company Home
  page.
build: A Brightwave workspace with a Company Home page, four top-level section pages and a working sub-page hierarchy
workflow:
- Create the workspace
- Build pages from the site map
- Add and transform blocks
- Organise the sidebar
files:
- path: brightwave-company-profile.md
  description: Company background used for the Company Home callout
- path: workspace-structure.csv
  description: Site map of the four sections and their sub-pages
steps:
- n: 1
  title: Sign in and create the workspace
  detail: Go to notion.com and sign in (a free personal account is enough for the course). In the workspace switcher
    at the top left choose Create or join workspace, select For my team, name it Brightwave Media and choose the
    Free plan. The new workspace opens with a Getting Started page.
  done: false
- n: 2
  title: Read the supplied site map
  detail: Open workspace-structure.csv from the lab folder. It lists the four top-level sections — Company Wiki,
    Content Hub, Client Projects and Help Centre — and the sub-pages each must contain.
  done: false
- n: 3
  title: Create the Company Home page
  detail: In the sidebar click + New page (or the + next to Private). Title it Company Home, click Add icon and
    choose a lighthouse emoji, then Add cover and pick a gallery image. Press Enter to start writing in the body.
  done: false
- n: 4
  title: Add blocks with slash commands
  detail: On the first empty line type /heading 1 and enter Welcome to Brightwave. Type /callout and write the one-line
    purpose of the workspace from brightwave-company-profile.md. Type /divider, then /bulleted list and list the
    four sections.
  done: false
- n: 5
  title: Transform and rearrange blocks
  detail: Hover a bullet, click the ⋮⋮ handle and choose Turn into → Toggle list. Drag the callout above the heading
    using the ⋮⋮ handle, then drag it back. Right-click a block to Duplicate and Delete it.
  done: false
- n: 6
  title: Create the four section pages as sub-pages
  detail: Under the bulleted list type /page and title it Company Wiki; press the back breadcrumb to return. Repeat
    for Content Hub, Client Projects and Help Centre. Each appears nested under Company Home in the sidebar.
  done: false
- n: 7
  title: Build the second level from the site map
  detail: Open Company Wiki and create the sub-pages listed in the CSV (About Brightwave, Policies, Team Directory,
    Onboarding). Do the same for the other three sections. Use the breadcrumbs at the top to move back up.
  done: false
- n: 8
  title: Organise the sidebar
  detail: Drag Company Home to the top of the Private section, click the ⋯ next to it and choose Add to Favorites
    so a Favorites section appears. Collapse and expand the toggles to check the hierarchy matches the CSV.
  done: false
- n: 9
  title: Record the result
  detail: Open the Steps checklist in the lab README and tick each step. Take a screenshot of the sidebar showing
    the full hierarchy for your evidence.
  done: false
acceptance_check: The sidebar shows Company Home in Favorites with the four section pages nested under it, each
  section contains the sub-pages listed in workspace-structure.csv, and Company Home carries an icon, a cover, a
  heading, a callout and a toggle list.
evidence: Screenshot of the expanded sidebar and of the Company Home page.
