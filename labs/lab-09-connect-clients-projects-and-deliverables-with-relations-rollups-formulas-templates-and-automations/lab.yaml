lab: 9
title: Connect Clients, Projects and Deliverables with Relations, Rollups, Formulas, Templates and Automations
course:
  title: Mastering Notion for Content, Project, and Database Management
  code: TGS-2023041080
  version: v6
topic: 6
day: 2
level: Advanced
alignment:
  knowledge: K7
  ability: A4
tools: Notion relations, rollups, formulas, database templates, automations
objective: Build a relational content system and stay aware of how Notion compares with other content management
  offerings
goal: You create the Clients and Deliverables databases, relate Clients → Projects → Tasks and Deliverables, roll
  up hours, budgets and completion, write formulas for health status and days remaining, build a Project Brief template,
  add an automation that notifies the owner when a deliverable is approved, and complete a market comparison of
  Notion against Confluence, Airtable and Monday.
build: A relational model (Clients, Projects, Tasks, Deliverables) with rollups, formulas, a default project template,
  one automation and a CMS market comparison table
workflow:
- Create relations
- Add rollups and formulas
- Build templates and automations
- Compare market offerings
files:
- path: clients.csv
  description: Five clients with industry, account manager and retainer
- path: deliverables.csv
  description: Eighteen deliverables linked to projects
- path: formulas.md
  description: The formulas used in this lab with an explanation of each function
- path: automation-rules.csv
  description: The automation and button rules to configure
- path: cms-market-comparison.csv
  description: Comparison grid of Notion, Confluence, Airtable and Monday.com to complete
steps:
- n: 1
  title: Create the Clients database
  detail: In Client Projects import clients.csv as Clients (Industry → Select, Account Manager → Person, Retainer
    (SGD) → Number).
  done: false
- n: 2
  title: Relate Projects to Clients
  detail: In Projects add a property Client (Relation) → Clients, turn on Show on Clients and name the reverse property
    Projects. Replace the old Client select values by picking the related client for each row, then delete the select
    property.
  done: false
- n: 3
  title: Relate Tasks to Projects
  detail: In Tasks add a Relation property Project → Projects with a two-way property Tasks. Assign every task to
    its project using the Project column in tasks.csv. Return to Lab 8's linked view in Nova Retail Launch and confirm
    the filter now works.
  done: false
- n: 4
  title: Create Deliverables and relate them
  detail: Import deliverables.csv as Deliverables; add a Relation to Projects (two-way, named Deliverables) and
    a Status property with Draft, In Review, Approved, Published.
  done: false
- n: 5
  title: Add rollups
  detail: 'In Projects add rollups: Total Hours = Tasks → Estimate (h) → Sum; Tasks Done = Tasks → Status → Percent
    per group Complete; Next Due = Tasks → Due → Earliest date. In Clients add Active Projects = Projects → Name
    → Count and Total Budget = Projects → Budget → Sum.'
  done: false
- n: 6
  title: Write formulas
  detail: 'In Projects add formula Days Left: dateBetween(prop("Dates").end, now(), "days"). Add formula Health:
    if(prop("Tasks Done") >= 0.8, "🟢 On track", if(prop("Days Left") < 7, "🔴 At risk", "🟡 Watch")). Add formula
    Budget/Hour: format(round(prop("Budget (SGD)") / prop("Total Hours"))).'
  done: false
- n: 7
  title: Create a Project Brief template
  detail: In Projects click the arrow next to New → New template. Title it Project Brief, set default Stage = Planning,
    and add body sections Objectives, Audience, Channels, Deliverables (a linked view of Deliverables filtered to
    this project), Risks. Set it as Default for all views.
  done: false
- n: 8
  title: Add an automation
  detail: 'In Deliverables click ⚡ Automations → New automation. Trigger: Status is set to Approved. Actions: Edit
    property Approved On = now; Send notification to the Owner person property with ''Deliverable approved — schedule
    publishing''. Turn it on and test by approving one deliverable.'
  done: false
- n: 9
  title: Add a button automation
  detail: In a project page add a /button named Log weekly review whose action Adds a page to Tasks with Name =
    Weekly review, Project = this project, Due = today + 7 days.
  done: false
- n: 10
  title: Complete the market comparison
  detail: Open cms-market-comparison.csv. Create a simple table on a page Market Offerings under Company Wiki and
    complete the empty cells for Notion, Confluence, Airtable and Monday.com across pricing tier, databases, wiki,
    API and publishing, using the Notion Help Center and vendor pages. Write two sentences on where Notion fits
    Brightwave.
  done: false
acceptance_check: Clients show Active Projects and Total Budget rollups, each project shows Total Hours, Tasks Done,
  Next Due, Days Left and a Health formula, new projects open with the Project Brief template, approving a deliverable
  sets Approved On and notifies the owner, and the Market Offerings table is complete for four tools.
evidence: Screenshots of the Projects table with rollups and formulas, of the automation, and of the market comparison
  table.
